sonar.projectKey=danielcopper_romm-tender
sonar.organization=danielcopper

# Quality Gate
# Make the scanner poll the gate and exit non-zero when it fails, so the
# `sonarcloud` CI job itself carries the gate verdict instead of the async
# SonarCloud app commit status. Branch protection then requires the job — which
# is skipped (and thus reported as passing) for Dependabot, whereas the app
# status never posts on Dependabot PRs and deadlocks auto-merge. Human PRs still
# hard-block: a failed gate fails the required job.
sonar.qualitygate.wait=true

# Sources
sonar.sources=py_modules,frontend/src,main.py
sonar.tests=tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,tests/**
sonar.python.version=3.11

# Coverage
sonar.python.coverage.reportPaths=coverage.xml
# Only sonar.javascript.lcov.reportPaths — SonarJS analyzes both .js and .ts here.
# The legacy sonar.typescript.lcov.reportPaths alias causes double-counting on older scanners.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
# py_modules/_vendor/ holds vendored third-party deps (vdf, …) — not our code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/defaults/**,**/bin/**,**/__pycache__/**,py_modules/_vendor/**
# Full frontend in scope. SonarCloud's new-code gate enforces 80% on changed
# lines only — existing untested components don't fail the gate, but any new
# code added to them will need tests.
#
# An exclusion names a PROPERTY of the code, never a place. A folder entry
# stands only where membership in the folder IS the property; every file entry
# carries its reason as a `// coverage-exempt:` marker in the file itself, so
# the reason travels with the file instead of staying behind with its old
# directory. This list and vitest.config.ts's `coverage.exclude` must agree —
# `scripts/check_coverage_exclusions.py` holds both halves and every asymmetry:
# the five Sonar-only entries below, and one Vitest-only entry that is absent
# here because it cannot be written here at all — it is the frontend test glob,
# and `{test,spec}` holds a comma this comma-separated list would split. Sonar
# takes the tests out of the ratio through `sonar.test.inclusions` instead.
#
# Frontend entries (identical in both lists):
#   - frontend/src/types/**: type declarations and the literal constants their
#     types are derived from — no functions and no branches
#   - frontend/src/test-utils/**: shared mock harnesses (e.g. @decky/api event
#     bus), reached only from the test run — by the tests and by
#     frontend/src/test-setup.ts, which wires the mock in
#   - frontend/src/test-setup.ts, frontend/src/bigpicture/patches/gameDetailPatch.tsx,
#     frontend/src/utils/styleInjector.ts: each states its own reason at the top
#     of the file
# Sonar-only, because Vitest's coverage scope is frontend/src alone:
#   - **/tests/**, **/conftest.py: the Python suite and its fixtures
#   - py_modules/_vendor/**: vendored third-party Python, not our code
#   - *.config.{js,ts}: build/test/lint config files (rollup, vitest, eslint, size-limit)
sonar.coverage.exclusions=**/tests/**,**/conftest.py,frontend/src/types/**,frontend/src/test-utils/**,frontend/src/test-setup.ts,frontend/src/bigpicture/patches/gameDetailPatch.tsx,frontend/src/utils/styleInjector.ts,*.config.js,*.config.ts,py_modules/_vendor/**

# Suppress false positives
# S6926: "async without await" — Decky Loader callable framework requires all
# exposed methods to be async, even when they only delegate to sync service calls.
sonar.issue.ignore.multicriteria=fp1,fp2,fp3,fp4,fp5
sonar.issue.ignore.multicriteria.fp1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.fp1.resourceKey=main.py
# S7503 also fires on service methods that are async for run_in_executor wrapping
sonar.issue.ignore.multicriteria.fp2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.fp2.resourceKey=py_modules/services/**
# S4830 (cert validation) + S5527 (hostname verification): SSL verification is
# intentionally optional — user-facing setting (allow_insecure_ssl) for
# self-hosted RomM servers with self-signed certificates.
sonar.issue.ignore.multicriteria.fp3.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.fp3.resourceKey=py_modules/adapters/romm/http.py
sonar.issue.ignore.multicriteria.fp4.ruleKey=python:S5527
sonar.issue.ignore.multicriteria.fp4.resourceKey=py_modules/adapters/romm/http.py
# S8980 ("redundant act()") reads only the flushing call it wraps. Every act()
# it flags in this file wraps that call AND a microtask drain
# (`for (...) await Promise.resolve()`) for the backend work the click starts;
# the state updates land during the drain, outside the flushing call's own act.
# Measured by removing all fifteen: 21 tests fail, five runs out of five, and
# `frontend/src/test-setup.ts`'s console.error guard reports "An update to LibraryPage
# inside a test was not wrapped in act(...)". The premise is false here, so the
# rule is off for this file rather than the tests being made flaky to satisfy
# it. An act() this file adds around a call that really does flush on its own
# is not covered by that reasoning and should be removed by hand.
sonar.issue.ignore.multicriteria.fp5.ruleKey=typescript:S8980
sonar.issue.ignore.multicriteria.fp5.resourceKey=frontend/src/bigpicture/library/PlatformsTab.test.tsx
