[tools]
node = "24"      # major pin — "lts" is a moving alias that silently jumps majors; CI uses node 24
pnpm = "10.29.3" # exact — must match frontend/package.json "packageManager"; bump both together
python = "3.14"  # why 3.14, and every other copy: docs/contributing/dependency-management.md
uv = "0.10.2"    # exact — uv creates the venv AND compiles the dependency locks; pin so the local resolver == the lock author
deno = "2.8"     # minor pin — deno fmt is a formatter; a version jump can reformat Markdown (the CI drift we're killing)
"aqua:koalaman/shellcheck" = "0.11.0" # exact — CI's lint job installs the same release; bump both together

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install JS and Python dependencies"
run = [
  "pnpm -C frontend install",
  "uv pip install -r requirements-dev.lock -r docs/requirements.lock",
  "git config core.hooksPath .githooks",
]

[tasks.lock-update]
description = "Recompile the pinned Python dependency locks from their sources (run after editing a source or bumping a pin)"
# `--output-file=` (not `-o`): Renovate's pip-compile manager parses the uv
# command recorded in each lock header and only recognizes the long `--output-file`
# form with an `=`. `-o` makes it bail with "Option -o not supported (yet)", so it
# can't recompile the lock on a dependency-update PR. `--python-version=` likewise:
# the locks resolve for the oldest Python Tender supports rather than the
# toolchain's, Renovate reads the version it recompiles with from that option, and
# it refuses the option spelled without the `=` (`throwForNoEqualSignInOptionWithArgument`
# in its lib/modules/manager/pip-compile/common.ts).
run = [
    "uv pip compile requirements-dev.txt --python-version=3.12 --output-file=requirements-dev.lock",
    "uv pip compile docs/requirements.txt --python-version=3.12 --output-file=docs/requirements.lock",
]

[tasks.build]
description = "Build frontend (dev: with source maps)"
usage = '''
flag "--surface" help="Build the desktop surface into the panel (build:desktop rather than build:dev). Not remembered: a run without it builds build:dev."
'''
run = '''
if [ "${usage_surface:-}" = true ]; then
  pnpm -C frontend build:desktop
else
  pnpm -C frontend build:dev
fi
'''
depends = ["setup"]

[tasks.test]
description = "Run Python tests"
# Why `-n auto` is here and not in pytest.ini: docs/contributing/development.md, "Testing".
run = "python -m pytest tests/ -q -n auto"

[tasks."test:frontend"]
description = "Run frontend tests"
run = "pnpm -C frontend test"

[tasks."test:frontend:coverage"]
description = "Run frontend tests with coverage report"
run = "pnpm -C frontend test:coverage"

[tasks."lint:md"]
description = "Lint Markdown with markdownlint-cli2 (CI parity)"
# The exclusions are anchored where the trees they name actually sit. A bare
# `node_modules` prunes the top-level one only, so every dependency tree one
# level down was linted — and `.claude/worktrees` holds whole checkouts of this
# repo, each with its own. `.claude` itself may NOT be excluded: `.claude/rules`
# is repo documentation and has to stay in the checked set. Keep this list and
# the markdownlint job in .github/workflows/ci.yml identical.
# Invoked by PATH rather than through `pnpm -C frontend exec`: the globs below are
# anchored at the repository root, and `-C` would move the working directory into
# the package and silently re-scope every one of them. `markdownlint-cli2` is a
# dependency of the frontend package because that is where this repo's only
# node_modules lives — not because linting Markdown belongs to the frontend; most
# of what it reads is under docs/. Why the resolver's recorded machines are left
# out: tests/adapters/atlas_vectors/README.md; why the vendored atlas tree is:
# backend/_vendor/README.md, "Markdown".
run = "frontend/node_modules/.bin/markdownlint-cli2 \"**/*.md\" \"!**/node_modules\" \"!**/.venv\" \"!.claude/worktrees\" \"!CHANGELOG.md\" \"!site\" \"!tests/adapters/atlas_vectors/vectors\" \"!backend/_vendor/atlas\""

[tasks.lint]
description = "Check Cosmic Python architecture rules (layer imports + forbidden service calls) and Markdown"
depends = ["lint:md"]
run = [
    "PYTHONPATH=backend lint-imports",
    "python scripts/check_service_independence_contract.py",
    "python scripts/check_endpoint_parity.py",
    "bash scripts/check_cosmic_call_bans.sh",
    "python scripts/check_module_size.py",
    "python scripts/check_aggregate_field_assignment.py",
    "python scripts/check_uow_seam_nesting.py",
    "python scripts/check_failure_shape.py --check",
    "python scripts/check_404_not_unreachable.py --check",
    "python scripts/check_urlopen_choke_point.py",
    "python scripts/check_live_device_id.py",
    "bash scripts/check_no_bare_ignores.sh",
    "python scripts/check_event_parity.py",
    "python scripts/check_reason_parity.py",
    "python scripts/check_settings_owner.py",
    "python scripts/check_sync_lifecycle_owner.py",
    "python scripts/check_background_tasks.py",
    "python scripts/check_seam_owner.py",
    "python scripts/check_read_only_module.py",
    "python scripts/check_resolver_reading.py",
    "python scripts/check_coverage_exclusions.py",
    "python scripts/check_lock_sync.py",
    "python scripts/check_markdown_links.py",
    "python scripts/check_invariant_register.py",
    "python scripts/check_romm_min_version.py",
    "python scripts/check_third_party_notices.py",
    "cd backend/native && sha256sum -c libgavel-x86_64-linux.so.sha256",
    "python scripts/check_vendored_trees.py",
    "python scripts/check_generated_tab_icon.py",
    # The scripts that run outside this repository — the installer, the
    # packager whose tarball it takes, and on a dev target the dispatcher, the
    # install script setup:remote-target sends, and the scripts the dev tasks'
    # --target run there. The rest are developer tooling and stay out of scope.
    # CI's shellcheck step runs the same list.
    "shellcheck install.sh scripts/package.sh scripts/dev_dispatch.sh scripts/dev_target_install.sh scripts/dev_target.sh scripts/dev_steam.sh scripts/dev_place_window.sh",
    "python scripts/check_shell_answer_functions.py",
    "python scripts/check_generated_installer_logo.py",
]

[tasks.gate]
description = "Run the CI battery locally in one command — every PR check in ci.yml but the jobs and steps named under \"Full CI gate\" in docs/contributing/development.md (slow: full pytest + frontend build)"
# The CI jobs, as tasks mise runs side by side: `test` is the `test` job,
# `lint` the architecture-gate half of the `lint` job plus `markdownlint` and the
# `build` job's tab-glyph check, `gate:python-static` the ruff/basedpyright half of
# `lint`, `gate:frontend-static` and `gate:build` the rest of the `build` job
# but the steps named under "Full CI gate", `gate:frontend-test` the
# `frontend-test` job (`pnpm test` stands in for CI's `pnpm test:coverage` —
# pass/fail parity), and `gate:markdown-format` the `markdown-format` job.
# Omitted: `test-3.12`, `test-3.13` and the two jobs that feed Sonar (see "Full CI gate" in
# docs/contributing/development.md).
depends = [
    "test",
    "lint",
    "gate:python-static",
    "gate:frontend-static",
    "gate:build",
    "gate:markdown-format",
    "gate:frontend-test",
]

[tasks."gate:python-static"]
description = "Gate step: ruff check, ruff format --check, basedpyright"
hide = true
run = ["ruff check .", "ruff format --check .", "basedpyright"]

[tasks."gate:frontend-static"]
description = "Gate step: eslint, prettier --check, tsc typecheck"
hide = true
run = ["pnpm -C frontend lint", "pnpm -C frontend format:check", "pnpm -C frontend typecheck"]

[tasks."gate:build"]
description = "Gate step: the production build, then everything that reads what it produced"
hide = true
# The bundle check, the package budgets, the size budget and the packager read what
# the build produced, and the tarball check reads the packager's. `build/` is emptied
# first: nothing else ever clears it, so after a version change it would hold two
# archives and the glob below would match both.
run = [
    "pnpm -C frontend build",
    "pnpm -C frontend check:bundle",
    "pnpm -C frontend check:packages",
    "pnpm -C frontend size",
    "rm -rf build && bash scripts/package.sh --source . --out build",
    "python scripts/check_release_tarball.py build/romm-tender-*.tar.gz",
]

[tasks."gate:markdown-format"]
description = "Gate step: deno fmt --check"
hide = true
run = "deno fmt --check"

[tasks."gate:frontend-test"]
description = "Gate step: the frontend suite, once the backend suite is done"
hide = true
# Never beside pytest: each suite spreads over every CPU, so running both at once
# buys no time, and together they exhaust a 16 GB machine's memory.
depends = ["test"]
run = "pnpm -C frontend test"

[tasks.dev]
description = "Build the panel, restart Steam into the window and display a dev:bpm* / dev:desktop* task last chose (the desktop client, placed nowhere, if none has), and run the backend, which loads the panel into it — dev:frontend and dev:backend in one (restarts Steam)"
raw = true
usage = '''
flag "--surface" help="Build the desktop surface into the panel (build:desktop rather than build:dev). Not remembered: a run without it builds build:dev."
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>: built here, Steam and the backend there."
'''
# Why this task restarts Steam rather than loading into the one that is up,
# and why the window is remembered rather than read:
# docs/contributing/frontend-dev-loop.md.
#
# Each step is ordered ahead of the one it would otherwise waste. The lock is
# asked first: it is the cheapest question there is, and every refusal it can
# give is one this task cannot recover from, so anything ahead of it is spent
# for nothing. The build follows, so a failed build costs no restart; the
# restart follows that; and the backend is exec'd last, because nothing after
# an `exec` runs. The build is a line in this block rather than a `depends`
# entry for that reason alone — mise runs a dependency ahead of the whole
# block, which would put it ahead of the question too. `exec` so Ctrl-C
# reaches the backend itself rather than mise: the process unloads on SIGINT,
# and an interrupted unload leaves behind the half-finished state its start-up
# routines exist to repair. The backend needs
# `~/.steam/steam/.cef-enable-remote-debugging` to exist.
#
# With --target every dev task hands over to scripts/dev_target.py, which does
# the same steps on that target, and nothing below the hand-over runs:
# docs/contributing/frontend-dev-loop.md, "The dev tasks on a target".
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" ${usage_surface:+--surface} -- dev
fi
python scripts/dev_backend_lock.py
mise run build ${usage_surface:+--surface}
bash scripts/dev_steam.sh restart
exec python backend/main.py
'''

[tasks.package]
description = "Build the frontend and assemble the release tarball under build/ (the artifact install.sh --from takes)"
# The production build, not build:dev: a release carries no source maps. The
# packager drops any it finds, so this is what keeps them out of the tarball
# rather than what would notice them. Two steps rather than one because the
# packager takes a directory and builds nothing itself, so the release workflow
# runs the same two steps and there is one layout with one producer.
run = ["pnpm -C frontend build", "bash scripts/package.sh --source . --out build"]

[tasks.install]
description = "Install the newest release tarball under build/ (mise run package) on a target with install.sh --from there, as a user installs a release (--target only)"
raw = true
usage = '''
flag "--target <name>" help="Install it on the target setup:remote-target prepared under <name>."
flag "--yes" help="Pass --yes to install.sh: the question a first install asks while install.sh still asks it (before its ACK_UNTIL) cannot be answered over the target's login, which has no terminal."
'''
# What it sends and runs there, and why --yes is passed only when given:
# docs/contributing/frontend-dev-loop.md, "Installing the release on a target".
run = '''
if [ -z "${usage_target:-}" ]; then
  echo "install installs the release tarball on a target: give --target <name>. Here, run install.sh --from build/romm-tender-<version>.tar.gz." >&2
  exit 2
fi
exec python scripts/dev_target.py --target "$usage_target" ${usage_yes:+--yes} -- install
'''

[tasks.docs]
description = "Serve the documentation site locally with live reload"
run = "mkdocs serve"

[tasks."docs:build"]
description = "Build the documentation site (strict mode fails on broken links)"
run = "mkdocs build --strict"

[tasks."dev:fake-github"]
description = "Serve the release tarballs in build/ as a fake GitHub on 127.0.0.1:8765, for the update check and install.sh — prints the two variables to set; flags after -- (see --help)"
run = "python scripts/fake_github.py"

[tasks."dev:ui-scale"]
description = "Emulate Game Mode's metrics in Big Picture — size the window to the Deck's 1280x800 AND force its display scale (the dev loop otherwise lies about QAM height)"
raw = true
# The optional mode arg reaches the script as $usage_mode (mise exposes usage-spec
# args as usage_<name> env vars).
usage = '''
arg "[mode]" help="'deck' (1.5, = Game Mode metrics), a bare factor (2.0-2.4 = 'Larger text', ~1.28 = docked 1080p, ~1.71 = docked 1440p), 'steam' (adopt the UI Scale set in Steam), or 'auto' (restore automatic scaling and exit)" default="deck"
complete "mode" run="printf 'deck\\nsteam\\nauto\\n'"
flag "--stop" help="With --target: stop the dev:ui-scale running there, which restores the scale and the window — for one whose terminal is gone; a Ctrl-C while it runs does the same."
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>."
'''
# Holds until Ctrl-C, then restores BOTH halves as they were BEFORE the run: the
# scale (auto stays auto; a manual UI Scale is put back as it was, never flipped to
# auto) and the Big Picture window's geometry + fullscreen state. Steam persists a
# forced factor to config.vdf, so leaving it forced is not harmless.
# `exec` so Ctrl-C / SIGTERM reach the script itself (mise is not left in the
# signal path, which is what makes the restore reliable).
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" ${usage_stop:+--stop} -- dev:ui-scale "$usage_mode"
fi
if [ -n "${usage_stop:-}" ]; then
  echo "--stop stops a dev:ui-scale on a target: give --target <name>. Here, Ctrl-C stops it." >&2
  exit 2
fi
exec python3 scripts/dev_ui_scale.py "$usage_mode"
'''

[tasks."setup:remote-target"]
description = "Prepare another machine as a target for the dev tasks' --target, or repair it: the dispatcher and the dev loop's key's one authorized_keys line there, the key and the target's entry in ~/.config/romm-tender-dev/ here (--print: a script to run on a target this machine cannot log into yet)"
raw = true
usage = '''
arg "<name>" help="The name to give the target: letters, digits, '.', '_' and '-'."
arg "<destination>" help="What your own ssh reaches the target as: user@address, or an alias from your SSH config."
flag "--print" help="Contact nothing: print a script to run on the target, then run the setup again without --print."
'''
# `raw` because a login may ask for a password or about a host key on the
# terminal. `--` so a name or destination is never read as an option.
run = '''
exec python scripts/setup_remote_target.py ${usage_print:+--print} -- "$usage_name" "$usage_destination"
'''

[tasks."dev:bpm"]
description = "Build the panel, restart Steam into windowed Big Picture on a chosen display (none: placed nowhere), remember that for dev, and run the backend (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the Big Picture window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
flag "--surface" help="Build the desktop surface into the panel (build:desktop rather than build:dev). Not remembered: a run without it builds build:dev."
complete "display" run="bash scripts/dev_place_window.sh --list"
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>: built here, Steam and the backend there."
'''
# dev, with the window chosen here rather than recalled.
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" ${usage_surface:+--surface} -- dev:bpm "${usage_display:-}"
fi
python scripts/dev_backend_lock.py
mise run build ${usage_surface:+--surface}
bash scripts/dev_steam.sh restart bpm "${usage_display:-}"
exec python backend/main.py
'''

[tasks."dev:desktop"]
description = "Build the panel, restart Steam into the desktop client on a chosen display (none: placed nowhere), remember that for dev, and run the backend (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the desktop client's window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
flag "--surface" help="Build the desktop surface into the panel (build:desktop rather than build:dev). Not remembered: a run without it builds build:dev."
complete "display" run="bash scripts/dev_place_window.sh --list"
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>: built here, Steam and the backend there."
'''
# dev, with the window chosen here rather than recalled.
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" ${usage_surface:+--surface} -- dev:desktop "${usage_display:-}"
fi
python scripts/dev_backend_lock.py
mise run build ${usage_surface:+--surface}
bash scripts/dev_steam.sh restart desktop "${usage_display:-}"
exec python backend/main.py
'''

[tasks."dev:backend"]
description = "Build the panel and run the backend against the Steam already running — dev without the restart. The task after a dev:*-reset, or beside a Steam carrying no panel; beside a panel an earlier backend loaded, the backend has Steam reload its JS context once no app is running, which closes what is open"
raw = true
usage = '''
flag "--surface" help="Build the desktop surface into the panel (build:desktop rather than build:dev). Not remembered: a run without it builds build:dev."
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>: built here, Steam and the backend there."
'''
# Starts a backend without restarting Steam. What it cannot do — load into a
# context that already carries the panel's marker, or be reached by a panel a
# previous backend loaded — is the same pair of facts behind the restart the
# tasks above do; the backend answers it by having Steam reload its JS context
# once no app is running: docs/contributing/frontend-dev-loop.md.
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" ${usage_surface:+--surface} -- dev:backend
fi
python scripts/dev_backend_lock.py
mise run build ${usage_surface:+--surface}
exec python backend/main.py
'''

[tasks."dev:frontend"]
description = "Build the panel and restart Steam into the remembered window ([display] moves it there and is remembered; none repeats the remembered display) — dev without the backend: the one already running loads the panel itself, so a sync in flight survives. Refuses when no backend is running"
raw = true
usage = '''
arg "[display]" help="Move the remembered window to this display: 'internal' or an output name (dp2, DP-3, ...). Omitted, the remembered display stands — this task repeats a choice rather than stating one."
flag "--surface" help="Build the desktop surface into the panel (build:desktop rather than build:dev). Not remembered: a run without it builds build:dev."
complete "display" run="bash scripts/dev_place_window.sh --list"
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>: built here, Steam and the backend there."
'''
# The mirror of dev:backend, and why it needs the opposite question: it starts
# no backend, so with none running the restart would give a fresh Steam that
# nothing loads a panel into.
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" ${usage_surface:+--surface} -- dev:frontend "${usage_display:-}"
fi
python scripts/dev_backend_lock.py --require-running
mise run build ${usage_surface:+--surface}
bash scripts/dev_steam.sh restart-remembered "${usage_display:-}"
'''

[tasks."dev:bpm-reset"]
description = "Restart Steam into windowed Big Picture on a chosen display (none: placed nowhere) and remember that for dev — no build; a backend already running loads the panel (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the Big Picture window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
complete "display" run="bash scripts/dev_place_window.sh --list"
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>."
'''
# Beside Decky Loader the restart also brings back Decky's own QAM, which
# survives only the first Big Picture entry per Steam process.
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" -- dev:bpm-reset "${usage_display:-}"
fi
bash scripts/dev_steam.sh restart bpm "${usage_display:-}"
'''

[tasks."dev:desktop-reset"]
description = "Restart Steam into the desktop client on a chosen display (none: placed nowhere) and remember that for dev — no build; a backend already running loads the panel (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the desktop client's window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
complete "display" run="bash scripts/dev_place_window.sh --list"
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>."
'''
run = '''
if [ -n "${usage_target:-}" ]; then
  exec python scripts/dev_target.py --target "$usage_target" -- dev:desktop-reset "${usage_display:-}"
fi
bash scripts/dev_steam.sh restart desktop "${usage_display:-}"
'''

[tasks."dev:stop"]
description = "Stop the backend on a target — the dev backend or the installed service, whichever holds the lock there — and leave Steam and a dev:ui-scale running (--target only): for a backend whose following ended without a Ctrl-C, or the installed service"
raw = true
usage = '''
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>."
'''
run = '''
if [ -z "${usage_target:-}" ]; then
  echo "dev:stop stops the backend on a target: give --target <name>. Here, Ctrl-C stops it." >&2
  exit 2
fi
exec python scripts/dev_target.py --target "$usage_target" -- dev:stop
'''

[tasks."dev:log"]
description = "Show the backend's log on a target, or follow it with --follow (--target only)"
raw = true
usage = '''
flag "--follow" help="Follow the log until Ctrl-C, which ends only the following."
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>."
'''
run = '''
if [ -z "${usage_target:-}" ]; then
  echo "dev:log shows the backend's log on a target: give --target <name>. Here, the backend's terminal shows it." >&2
  exit 2
fi
exec python scripts/dev_target.py --target "$usage_target" ${usage_follow:+--follow} -- dev:log
'''

[tasks."dev:status"]
description = "Say what holds the single-instance lock on a target and whether a dev:ui-scale runs there (--target only)"
raw = true
usage = '''
flag "--target <name>" help="Run it on the target setup:remote-target prepared under <name>."
'''
run = '''
if [ -z "${usage_target:-}" ]; then
  echo "dev:status reports on a target: give --target <name>." >&2
  exit 2
fi
exec python scripts/dev_target.py --target "$usage_target" -- dev:status
'''
