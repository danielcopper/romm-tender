[tools]
node = "24"      # major pin — "lts" is a moving alias that silently jumps majors; CI uses node 24
pnpm = "10.29.3" # exact — must match frontend/package.json "packageManager"; bump both together
python = "3.13"  # why 3.13, and every other copy: docs/contributing/dependency-management.md
uv = "0.10.2"    # exact — uv creates the venv AND compiles the dependency locks; pin so the local resolver == the lock author
deno = "2.8"     # minor pin — deno fmt is a formatter; a version jump can reformat Markdown (the CI drift we're killing)

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install JS and Python dependencies"
run = ["pnpm -C frontend install", "uv pip install -r requirements-dev.lock", "git config core.hooksPath .githooks"]

[tasks.lock-update]
description = "Recompile the pinned Python dependency locks from their sources (run after editing a source or bumping a pin)"
# `--output-file=` (not `-o`): Renovate's pip-compile manager parses the uv
# command recorded in each lock header and only recognizes the long `--output-file`
# form with an `=`. `-o` makes it bail with "Option -o not supported (yet)", so it
# can't recompile the lock on a dependency-update PR.
run = [
    "uv pip compile requirements-dev.txt --output-file=requirements-dev.lock",
    "uv pip compile docs/requirements.txt --output-file=docs/requirements.lock",
]

[tasks.build]
description = "Build frontend (dev: with source maps)"
run = "pnpm -C frontend build:dev"
depends = ["setup"]

[tasks.test]
description = "Run Python tests"
run = "python -m pytest tests/ -q"

[tasks."test:frontend"]
description = "Run frontend tests"
run = "pnpm -C frontend test"

[tasks."test:frontend:coverage"]
description = "Run frontend tests with coverage report"
run = "pnpm -C frontend test:coverage"

[tasks."lint:md"]
description = "Lint Markdown with markdownlint-cli2 (CI parity)"
# The exclusions are anchored where the trees they name actually sit. A bare
# `node_modules` prunes the top-level one only, so every dependency tree one
# level down was linted — and `.claude/worktrees` holds whole checkouts of this
# repo, each with its own. `.claude` itself may NOT be excluded: `.claude/rules`
# is repo documentation and has to stay in the checked set. Keep this list and
# the markdownlint job in .github/workflows/ci.yml identical.
# Invoked by PATH rather than through `pnpm -C frontend exec`: the globs below are
# anchored at the repository root, and `-C` would move the working directory into
# the package and silently re-scope every one of them. `markdownlint-cli2` is a
# dependency of the frontend package because that is where this repo's only
# node_modules lives — not because linting Markdown belongs to the frontend; most
# of what it reads is under docs/.
run = "frontend/node_modules/.bin/markdownlint-cli2 \"**/*.md\" \"!**/node_modules\" \"!**/.venv\" \"!.claude/worktrees\" \"!CHANGELOG.md\" \"!site\""

[tasks.lint]
description = "Check Cosmic Python architecture rules (layer imports + forbidden service calls) and Markdown"
depends = ["lint:md"]
run = [
    "PYTHONPATH=backend lint-imports",
    "python scripts/check_service_independence_contract.py",
    "python scripts/check_callable_manifest.py",
    "bash scripts/check_cosmic_call_bans.sh",
    "python scripts/check_module_size.py",
    "python scripts/check_aggregate_field_assignment.py",
    "python scripts/check_uow_seam_nesting.py",
    "python scripts/check_failure_shape.py --check",
    "python scripts/check_404_not_unreachable.py --check",
    "python scripts/check_urlopen_choke_point.py",
    "bash scripts/check_no_bare_ignores.sh",
    "python scripts/check_event_parity.py",
    "python scripts/check_settings_owner.py",
    "python scripts/check_sync_lifecycle_owner.py",
    "python scripts/check_seam_owner.py",
    "python scripts/check_read_only_module.py",
    "python scripts/check_coverage_exclusions.py",
    "python scripts/check_lock_sync.py",
    "python scripts/check_markdown_links.py",
    "python scripts/check_romm_min_version.py",
    "cd backend/native && sha256sum -c libgavel-x86_64-linux.so.sha256",
    "python scripts/check_vendored_trees.py",
    "python scripts/check_generated_tab_icon.py",
    # The two scripts a user runs outside this repository — the installer and
    # the packager whose tarball it takes. The rest are developer tooling and
    # stay out of scope.
    "shellcheck install.sh scripts/package.sh",
    "python scripts/check_shell_answer_functions.py",
    "python scripts/check_generated_installer_logo.py",
]

[tasks.gate]
description = "Run the full CI battery locally — every PR check in ci.yml, in one command (slow: full pytest + frontend build)"
# depends: `test` (pytest) + `lint` (import-linter, the check_* scripts, markdownlint)
# cover the Python-test and architecture-gate CI jobs. The run list below adds the
# rest of ci.yml: the ruff/basedpyright half of the `lint` job, the whole `build`
# job (eslint/prettier/build/bundle shape/typecheck/size, and the release tarball
# packed and checked), the `frontend-test` job (`pnpm test`
# stands in for CI's `pnpm test:coverage` — pass/fail parity), and `markdown-format`
# (`deno fmt --check`). `pnpm build` precedes `pnpm check:bundle`, `pnpm size` and
# the packager because all three depend on what the build produced. `build/` is emptied
# first: nothing else ever clears it, so after a version change it would hold two
# archives and the glob below would match both. Not reproducible locally, so omitted: the SonarCloud scan +
# sonar-gate (need SONAR_TOKEN and CI coverage artifacts).
depends = ["test", "lint"]
run = [
    "ruff check .",
    "ruff format --check .",
    "basedpyright",
    "pnpm -C frontend lint",
    "pnpm -C frontend format:check",
    "pnpm -C frontend build",
    "pnpm -C frontend check:bundle",
    "rm -rf build && bash scripts/package.sh --source . --out build",
    "python scripts/check_release_tarball.py build/romm-tender-*.tar.gz",
    "pnpm -C frontend typecheck",
    "pnpm -C frontend size",
    "pnpm -C frontend test",
    "deno fmt --check",
]

[tasks.dev]
description = "Build the panel, restart Steam into the window and display a dev:bpm* / dev:desktop* task last chose (the desktop client, placed nowhere, if none has), and run the backend, which loads the panel into it — dev:frontend and dev:backend in one (restarts Steam)"
raw = true
# Why this task restarts Steam rather than loading into the one that is up,
# and why the window is remembered rather than read:
# docs/contributing/frontend-dev-loop.md.
#
# Each step is ordered ahead of the one it would otherwise waste. The lock is
# asked first: it is the cheapest question there is, and every refusal it can
# give is one this task cannot recover from, so anything ahead of it is spent
# for nothing. The build follows, so a failed build costs no restart; the
# restart follows that; and the backend is exec'd last, because nothing after
# an `exec` runs. The build is a line in this block rather than a `depends`
# entry for that reason alone — mise runs a dependency ahead of the whole
# block, which would put it ahead of the question too. `exec` so Ctrl-C
# reaches the backend itself rather than mise: the process unloads on SIGINT,
# and an interrupted unload leaves behind the half-finished state its start-up
# routines exist to repair. The backend needs
# `~/.steam/steam/.cef-enable-remote-debugging` to exist.
run = '''
python scripts/dev_backend_lock.py
mise run build
bash scripts/dev_steam.sh restart
exec python backend/main.py
'''

[tasks.package]
description = "Build the frontend and assemble the release tarball under build/ (the artifact install.sh --from takes)"
# The production build, not build:dev: a release carries no source maps. The
# packager drops any it finds, so this is what keeps them out of the tarball
# rather than what would notice them. Two steps rather than one because the
# packager takes a directory and builds nothing itself, so the release workflow
# runs the same two steps and there is one layout with one producer.
run = ["pnpm -C frontend build", "bash scripts/package.sh --source . --out build"]

[tasks.docs]
description = "Serve the documentation site locally with live reload"
run = "mkdocs serve"

[tasks."docs:build"]
description = "Build the documentation site (strict mode fails on broken links)"
run = "mkdocs build --strict"

[tasks."dev:ui-scale"]
description = "Emulate Game Mode's metrics in Big Picture — size the window to the Deck's 1280x800 AND force its display scale (the dev loop otherwise lies about QAM height)"
raw = true
# The optional mode arg reaches the script as $usage_mode (mise exposes usage-spec
# args as usage_<name> env vars).
usage = '''
arg "[mode]" help="'deck' (1.5, = Game Mode metrics), a bare factor (2.0-2.4 = 'Larger text', ~1.28 = docked 1080p, ~1.71 = docked 1440p), 'steam' (adopt the UI Scale set in Steam), or 'auto' (restore automatic scaling and exit)" default="deck"
complete "mode" run="printf 'deck\\nsteam\\nauto\\n'"
'''
# Holds until Ctrl-C, then restores BOTH halves as they were BEFORE the run: the
# scale (auto stays auto; a manual UI Scale is put back as it was, never flipped to
# auto) and the Big Picture window's geometry + fullscreen state. Steam persists a
# forced factor to config.vdf, so leaving it forced is not harmless.
# `exec` so Ctrl-C / SIGTERM reach the script itself (mise is not left in the
# signal path, which is what makes the restore reliable).
run = '''
exec python3 scripts/dev_ui_scale.py "$usage_mode"
'''

[tasks."dev:bpm"]
description = "Build the panel, restart Steam into windowed Big Picture on a chosen display (none: placed nowhere), remember that for dev, and run the backend (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the Big Picture window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
complete "display" run="bash scripts/dev_place_window.sh --list"
'''
# dev, with the window chosen here rather than recalled.
run = '''
python scripts/dev_backend_lock.py
mise run build
bash scripts/dev_steam.sh restart bpm "${usage_display:-}"
exec python backend/main.py
'''

[tasks."dev:desktop"]
description = "Build the panel, restart Steam into the desktop client on a chosen display (none: placed nowhere), remember that for dev, and run the backend (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the desktop client's window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
complete "display" run="bash scripts/dev_place_window.sh --list"
'''
# dev, with the window chosen here rather than recalled.
run = '''
python scripts/dev_backend_lock.py
mise run build
bash scripts/dev_steam.sh restart desktop "${usage_display:-}"
exec python backend/main.py
'''

[tasks."dev:backend"]
description = "Build the panel and run the backend against the Steam already running — dev without the restart. The task after a dev:*-reset, or beside a Steam carrying no panel; beside one that already carries a panel it loads nothing, and that panel cannot reach it either"
raw = true
# Starts a backend without restarting Steam. What it cannot do — load into a
# context that already carries the panel's marker, or be reached by a panel a
# previous backend loaded — is the same pair of facts behind the restart the
# tasks above do: docs/contributing/frontend-dev-loop.md.
run = '''
python scripts/dev_backend_lock.py
mise run build
exec python backend/main.py
'''

[tasks."dev:frontend"]
description = "Build the panel and restart Steam into the remembered window ([display] moves it there and is remembered; none repeats the remembered display) — dev without the backend: the one already running loads the panel itself, so a sync in flight survives. Refuses when no backend is running"
raw = true
usage = '''
arg "[display]" help="Move the remembered window to this display: 'internal' or an output name (dp2, DP-3, ...). Omitted, the remembered display stands — this task repeats a choice rather than stating one."
complete "display" run="bash scripts/dev_place_window.sh --list"
'''
# The mirror of dev:backend, and why it needs the opposite question: it starts
# no backend, so with none running the restart would give a fresh Steam that
# nothing loads a panel into.
run = '''
python scripts/dev_backend_lock.py --require-running
mise run build
bash scripts/dev_steam.sh restart-remembered "${usage_display:-}"
'''

[tasks."dev:bpm-reset"]
description = "Restart Steam into windowed Big Picture on a chosen display (none: placed nowhere) and remember that for dev — no build; a backend already running loads the panel (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the Big Picture window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
complete "display" run="bash scripts/dev_place_window.sh --list"
'''
# Beside Decky Loader the restart also brings back Decky's own QAM, which
# survives only the first Big Picture entry per Steam process.
run = '''
bash scripts/dev_steam.sh restart bpm "${usage_display:-}"
'''

[tasks."dev:desktop-reset"]
description = "Restart Steam into the desktop client on a chosen display (none: placed nowhere) and remember that for dev — no build; a backend already running loads the panel (restarts Steam)"
raw = true
usage = '''
arg "[display]" help="Monitor for the desktop client's window: 'internal' or an output name (dp2, DP-3, ...). Omitted, the window is placed nowhere and dev remembers that."
complete "display" run="bash scripts/dev_place_window.sh --list"
'''
run = '''
bash scripts/dev_steam.sh restart desktop "${usage_display:-}"
'''
