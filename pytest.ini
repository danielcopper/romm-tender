[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --import-mode=importlib
# Only retain tmp_path dirs for failed tests — default "all" leaks one tmpdir per
# test per session, exhausting /tmp inodes during long-running agent test runs.
tmp_path_retention_policy = failed
# A blocked test must fail with its own name and a traceback, not run the CI job
# out of its `timeout-minutes: 15` unnamed (#1936). Which test is slowest depends
# on how the suite is run, so the bound is sized against the way CI runs it —
# with `--cov`. There the slowest is
# `test_websocket_protocol.py::TestTheTwoCaps::test_fragments_are_capped_on_their_running_total`
# at 12.2 s, against 1.8 s uninstrumented: coverage is what makes it the slowest
# test at all. 120 s is ~10x that, and still two minutes out of the job's
# fifteen. Without `--cov` nothing passes 5.0 s, so the same 120 looks there like
# a margin nobody sized — and that 5.0 s is a constant rather than a measurement:
# `test_runtime.py::TestASecondBackend::test_it_refuses_to_start` sits out
# `LOCK_RETRY_SECONDS` (`backend/host/single_instance.py`), so raising that moves
# the figure here, with nothing but this line connecting the two files.
# Only one family follows the machine. The tests that deliberately wait sleep a
# fixed wall clock — that lock window, and the RomM retry ladder's 1 s + 3 s gaps
# behind a patched `urlopen` — and answer 4-5 s instrumented or not, while the
# CPU-bound hypothesis property tests stretch: one costs 3.3 s uninstrumented and
# 7.6 s, 8.2 s and 9.4 s across three coverage runs. A slower machine is the
# direction the margin has to cover, and the asymmetry is the argument: too high
# costs only a slower red, too low turns honest waiting tests red at random.
# A test that legitimately needs longer raises its own with
# `@pytest.mark.timeout(<seconds>)`.
timeout = 120
