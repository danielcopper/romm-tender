[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --import-mode=importlib
# Only retain tmp_path dirs for failed tests — default "all" leaks one tmpdir per
# test per session, exhausting /tmp inodes during long-running agent test runs.
tmp_path_retention_policy = failed
# A blocked test must fail with its own name and a traceback, not run the CI job
# out of its `timeout-minutes: 15` unnamed (#1936). Sized against the configuration
# CI runs: under `--cov` the slowest test takes about 12 s, uninstrumented about
# 5 s — a local run makes the margin look more than twice what it is. 120 s is ten
# times that 12 s and two minutes of that quarter hour, and it bounds setup, call
# and teardown together where `--durations` reports one phase at a time, so the two
# are not the same quantity. Erring high costs only a slower red; erring low costs
# tests that deliberately wait. A test that needs longer raises its own with
# `@pytest.mark.timeout(<seconds>)`.
timeout = 120
