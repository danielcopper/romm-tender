[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --import-mode=importlib
# Only retain tmp_path dirs for failed tests — default "all" leaks one tmpdir per
# test per session, exhausting /tmp inodes during long-running agent test runs.
tmp_path_retention_policy = failed
# A blocked test must fail with its own name and a traceback, not run the CI job
# out of its `timeout-minutes: 15` unnamed (#1936). Sized against the configuration
# CI runs, `-n auto --cov`: on 8 logical CPUs its slowest test, the installer-logo
# check, took 14-35 s depending on what else the machine was running, where
# `mise run test` (`-n auto`, uninstrumented) shows about 11 s and a serial
# uninstrumented run about 5 s — a local run makes the margin look larger than it
# is. 120 s is more than three times that 35 s and two minutes of that quarter
# hour, and it bounds setup, call and teardown together where `--durations`
# reports one phase at a time, so the two are not the same quantity. Erring high
# costs only a slower red; erring low costs tests that deliberately wait. A test
# that needs longer raises its own with `@pytest.mark.timeout(<seconds>)`.
timeout = 120
# A coroutine that is created and never awaited fails the suite instead of
# leaving a warning behind in a green run. Why it takes both entries, and how to
# read such a failure: docs/contributing/development.md, "Code Quality".
filterwarnings =
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
