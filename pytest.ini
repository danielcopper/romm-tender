[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --import-mode=importlib
# Only retain tmp_path dirs for failed tests — default "all" leaks one tmpdir per
# test per session, exhausting /tmp inodes during long-running agent test runs.
tmp_path_retention_policy = failed
# A blocked test must fail with its own name and a traceback, not run the CI job
# out of its `timeout-minutes: 15` unnamed (#1936). 60 s is ~10x the slowest
# honest test, and the load on the machine is part of that number: an idle run
# puts it at 5.0 s (`TestASecondBackend::test_it_refuses_to_start`, sitting out a
# lock's retry window, with the socket-timeout tests just under it at 4 s), while
# under load the CPU-bound hypothesis property tests stretch past it to 5.9 s.
# The waiters are stable, the property tests are not, and a CI runner is the
# loaded case. 60 s is also one fifteenth of that job clock. The asymmetry is the
# argument: too high costs only a slower red, too low turns honest waiting tests
# red on a loaded runner.
# A test that legitimately needs longer raises its own with
# `@pytest.mark.timeout(<seconds>)`.
timeout = 60
