name: Bug report
description: Report a bug in Tender
title: "bug: "
labels: ["bug"]
assignees: ["danielcopper"]
body:
  - type: markdown
    attributes:
      value: |
        Required fields are the minimum for triage. Optional fields make things significantly easier to act on — please fill what you can, but **don't skip the report just because you can't fill everything**.

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What actually happened. Include error messages verbatim if any.
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Tender version
      description: "`cat ~/.local/lib/romm-tender/version.txt` prints it. Required for triage."
      placeholder: "0.18.0"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Numbered steps that reproduce the bug from a known-good state. Even a one-line description of what you were doing helps.
      placeholder: |
        1. Open the Quick Access menu > Tender
        2. Click "Sync Library"
        3. ...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen. Skip if it's obvious from "What happened".
    validations:
      required: false

  - type: input
    id: retrodeck-version
    attributes:
      label: RetroDECK version
      description: Shown in the RetroDECK Configurator. If you can't find it quickly, leave blank.
      placeholder: "0.9.0b"
    validations:
      required: false

  - type: input
    id: decky-version
    attributes:
      label: Decky Loader version
      description: Shown in the Decky settings panel. If you can't find it quickly, leave blank.
      placeholder: "3.0.5"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: |
        Tender's log is `~/.local/state/romm-tender/backend.log`; the service's own output goes to the journal: `journalctl --user -u romm-tender`. Set the log level to "Debug" in Tender's settings for full output.
      render: text
    validations:
      required: false
