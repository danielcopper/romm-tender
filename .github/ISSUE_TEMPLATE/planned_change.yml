name: Planned change
description: Propose or take on a change
assignees: ["danielcopper"]
body:
  - type: textarea
    id: today
    attributes:
      label: Today
      description: How it works today and what is missing.
    validations:
      required: true

  - type: textarea
    id: wanted
    attributes:
      label: Wanted
      description: What should change, for users or in the code.
    validations:
      required: true

  - type: textarea
    id: to_decide
    attributes:
      label: To decide
      description: 'Open questions, one checkbox each: `- [ ] …`. Once a question is answered under Decisions, check it off and point to the decision (`- [x] … → D1`).'
    validations:
      required: false

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Observable criteria. Each becomes a test that is seen failing first, or is marked (device) when only a manual check on hardware can show it.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What a reader might expect from this change that it does not do, and where that went (an issue number) if anywhere.
    validations:
      required: false
