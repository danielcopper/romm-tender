name: SonarCloud fork PRs

# ci.yml's `sonarcloud` job skips a fork's pull request; this workflow scans it
# instead, once that CI run has succeeded. GitHub runs a `workflow_run` workflow
# from the default branch's copy, in this repository's context and with
# SONAR_TOKEN — so a change to this file takes effect only once it is merged.
# SonarSource's pattern for pull requests from forks:
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis/github-actions-for-sonarcloud
#
# Nothing the fork wrote is executed here — no install, build, test, script or
# action from its checkout. A value taken from its run (the PR number, the
# branch name) reaches a shell only through `env:` and becomes a scanner
# argument only after a regex check; its tree and the coverage reports reach
# the scanner as the data it analyses.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read # the CI run's artifacts
  contents: read # the fork's head, fetched through this repository
  pull-requests: read # the cross-check of the PR number CI uploaded

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    steps:
      # Into RUNNER_TEMP, outside the workspace the fork's tree is checked out
      # into, so nothing in that tree can overwrite, stand in for or point at an
      # artifact the later steps read.
      - name: Download the PR metadata artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-metadata
          path: ${{ runner.temp }}/ci-artifacts/pr-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Python coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: ${{ runner.temp }}/ci-artifacts/coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: ${{ runner.temp }}/ci-artifacts/frontend-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `workflow_run.pull_requests` is empty for a run whose head is in a fork,
      # so the PR number comes from the artifact — which the fork's own copy of
      # ci.yml produced. It is trusted only once the API confirms that PR comes
      # from the repository GitHub reports for the run, and the base branch is
      # taken from that API answer. A PR whose head has moved on since this CI
      # run is not scanned and not failed: the CI run for its new head starts a
      # scan of its own. The branch name is only a label in SonarCloud, so a
      # character outside the regex is replaced rather than refused.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER_FILE: ${{ runner.temp }}/ci-artifacts/pr-metadata/pr-number
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          ref_re='^[A-Za-z0-9/_.-]+$'

          [[ -f "$PR_NUMBER_FILE" && ! -L "$PR_NUMBER_FILE" ]] || { echo "::error::No PR number in the artifact"; exit 1; }
          pr_number=$(head -c 32 "$PR_NUMBER_FILE" | tr -d '\n')
          [[ "$pr_number" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid head SHA"; exit 1; }
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Invalid head repository"; exit 1; }
          branch_label=$(printf '%s' "$HEAD_BRANCH" | LC_ALL=C tr -c 'A-Za-z0-9/_.-' '-')
          [[ "$branch_label" =~ $ref_re ]] || { echo "::error::No head branch name"; exit 1; }

          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          api_head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          api_head_repo=$(jq -r '.head.repo.full_name' <<<"$pr_json")
          base_ref=$(jq -r '.base.ref' <<<"$pr_json")
          [[ "$api_head_repo" == "$HEAD_REPO" ]] || { echo "::error::PR #$pr_number does not come from $HEAD_REPO"; exit 1; }
          if [[ "$api_head_sha" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$pr_number has moved on from $HEAD_SHA; not scanning a superseded head"
            echo "scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$base_ref" =~ $ref_re ]] || { echo "::error::Invalid base branch"; exit 1; }

          {
            echo "scan=true"
            echo "number=$pr_number"
            echo "head-branch=$branch_label"
            echo "base-ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

      # This repository, not the fork: a fork's head commit is reachable here
      # through the pull request's ref, and `origin/<base>` is then this
      # repository's branch, which the scanner diffs against for new code.
      # `actions/checkout` refuses a fork's head in a `workflow_run` workflow
      # unless told otherwise; nothing from this tree is executed, and the next
      # step replaces the fork's scanner inputs before the scan.
      - uses: actions/checkout@v7
        if: steps.pr.outputs.scan == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # Before the scan, the tree's scanner configuration and working paths are
      # removed or replaced with main's or CI's; only the fork's source stays:
      # - symlinks: one could point a source file at anything on the runner
      #   (/proc/self/environ holds SONAR_TOKEN in the scanner's process), and
      #   the scanner uploads source text;
      # - sonar-project.properties: the fork's copy could set any scanner
      #   property, `sonar.host.url` among them, which is where the token goes;
      #   main's is read from the commit this workflow file came from;
      # - .scannerwork, the scanner's working directory, and the coverage paths:
      #   removed, so nothing the fork planted there is read or written
      #   through. The reports land where the `sonarcloud` job in ci.yml puts
      #   them, which is what the report paths in sonar-project.properties name.
      - name: Replace the fork's scanner inputs
        if: steps.pr.outputs.scan == 'true'
        env:
          ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type l -print0 | xargs -0 -r rm -f --
          rm -rf -- sonar-project.properties .scannerwork coverage.xml coverage
          git cat-file blob "$GITHUB_SHA:sonar-project.properties" > sonar-project.properties

          for report in "$ARTIFACTS/coverage-report/coverage.xml" "$ARTIFACTS/frontend-coverage/lcov.info"; do
            [[ -f "$report" && ! -L "$report" ]] || { echo "::error::Missing coverage report ${report#"$ARTIFACTS"/}"; exit 1; }
          done
          cp -- "$ARTIFACTS/coverage-report/coverage.xml" coverage.xml
          mkdir coverage
          cp -- "$ARTIFACTS/frontend-coverage/lcov.info" coverage/lcov.info

      # `args` values stay unquoted, as SonarSource's guide says: quoting can
      # change how the action parses them. Each value that comes from the
      # fork's run passed the regex check above, so none holds whitespace or a
      # quote.
      - name: SonarCloud Scan
        if: steps.pr.outputs.scan == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}
            -Dsonar.pullrequest.branch=${{ steps.pr.outputs.head-branch }}
            -Dsonar.pullrequest.base=${{ steps.pr.outputs.base-ref }}
            -Dsonar.pullrequest.provider=github
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
