name: Release

# Two jobs: release-please decides the version, the tag and the changelog, and
# `assets` attaches what a tag is worth downloading — `romm-tender-<version>.tar.gz`
# and its `.sha256`, the pair `install.sh` fetches and verifies.
#
# The tarball is packed from the tag by the same `scripts/package.sh` a
# developer runs locally, and held to the same `scripts/check_release_tarball.py`
# every PR's build job already runs over a tarball of its own. There is one
# producer and one check, so a release is not the first place either is
# exercised.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize releases: two quick pushes to main must not run release-please
# concurrently and race on the release PR / tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mint a GitHub App installation token so release-please's PR/branch
      # pushes are authored by the App, not GITHUB_TOKEN. Pushes made with
      # GITHUB_TOKEN do not trigger workflows (anti-recursion), which left
      # the release PR's required status checks stuck "Expected" and
      # unmergeable. An App token makes those checks run automatically.
      # Scope it to exactly what release-please needs (contents + PRs).
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds from the TAG rather than from anything the job above left behind: a
  # tag is the one thing about a release that is fixed, so the tarball is
  # reproducible from it alone and no artifact has to be carried between two
  # workflows to make that true.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: write` is all that attaching an asset needs. The App token
    # stays with release-please, which is the job that has to author commits.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Why `package_json_file` is set rather than left to the default: the same
      # step in ci.yml.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build
        run: pnpm -C frontend build

      # No `--version`: the packager names the archive from the `version.txt`
      # release-please stamped on this tag, and the check below holds that name
      # against the tag itself. Passing the tag's version in would make the two
      # agree by construction and check nothing.
      - name: Pack the release tarball
        run: bash scripts/package.sh --source . --out build

      - name: Check it against what install.sh expects
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python3 scripts/check_release_tarball.py build/romm-tender-*.tar.gz --tag "$TAG"

      - name: Attach it to the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/romm-tender-*.tar.gz build/romm-tender-*.tar.gz.sha256 --clobber
