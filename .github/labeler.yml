# Path-to-label mapping for actions/labeler@v5.
#
# Labels listed here MUST exist in the repo (see `gh label list`). The action
# silently no-ops on unknown labels in some versions, but we keep the file
# tight: only labels we actually use today.

area:ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/src/**'

area:saves:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/saves/**'
          - 'backend/adapters/save_file.py'
          - 'backend/domain/save_answer.py'
          - 'backend/domain/save_attribution.py'
          - 'backend/domain/save_backup.py'
          - 'backend/domain/save_hash.py'
          - 'backend/domain/save_layout.py'
          - 'backend/domain/save_path.py'
          - 'backend/domain/save_slot.py'
          - 'backend/domain/save_status.py'
          - 'backend/domain/save_status_builders.py'
          - 'backend/domain/rom_save_sync_state.py'
          - 'tests/services/saves/**'

area:sync:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/library/**'
          - 'backend/services/migration/**'
          - 'backend/adapters/migration_file.py'
          - 'backend/domain/sync_action.py'
          - 'backend/domain/sync_diff.py'
          - 'backend/domain/sync_state.py'

area:downloads:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/downloads.py'
          - 'backend/adapters/download_file.py'

area:firmware:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/firmware/**'
          - 'backend/adapters/firmware_file.py'
          - 'backend/adapters/atlas_firmware.py'
          - 'backend/domain/firmware_paths.py'
          - 'backend/domain/firmware_wants.py'
          - 'backend/domain/bios_status.py'

area:artwork:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/steamgrid.py'
          - 'backend/services/artwork.py'
          - 'backend/adapters/cover_art_file_store.py'
          - 'backend/adapters/sgdb_artwork_cache.py'
          - 'backend/adapters/steamgriddb.py'
          - 'backend/domain/artwork_paths.py'
          - 'backend/domain/sgdb_artwork.py'

area:achievements:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/achievements.py'
          - 'backend/domain/achievements.py'

area:playtime:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/services/playtime.py'
          - 'backend/services/session_lifecycle.py'

area:architecture:
