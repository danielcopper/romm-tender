      - any-glob-to-any-file:
          - 'backend/bootstrap/**'
          - 'backend/services/protocols/**'
          - 'backend/domain/**'
          - 'backend/lib/**'
          - 'CLAUDE.md'
          - 'docs/architecture/invariants.md'

area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'sonar-project.properties'
          - 'scripts/**'
